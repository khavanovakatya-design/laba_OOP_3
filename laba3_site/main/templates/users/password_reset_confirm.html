{% extends 'base.html' %}
{% block content %}
<div class="login-page mt-100">
    <div class="container">
        <div class="login-form common-form mx-auto">
            <h2 class="section-heading text-center">Новый пароль</h2>
            {% if messages %}
                {% for message in messages %}
                    <p style="color: red;">{{ message }}</p>
                {% endfor %}
            {% endif %}
            <p>Введите код из письма и ваш новый пароль.</p>
            <form method="post">
                {% csrf_token %}
                <fieldset>
                    <label class="label">Код из письма</label>
                    {{ form.code }}
                </fieldset>
                <fieldset>
                    <label class="label">Новый пароль</label>
                    {{ form.new_password1 }}
                </fieldset>
                <fieldset>
                    <label class="label">Подтвердите пароль</label>
                    {{ form.new_password2 }}
                </fieldset>
                <button type="submit" class="btn-primary d-block mt-3 btn-signin">СОХРАНИТЬ ПАРОЛЬ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
