{% extends 'base.html' %}

{% block content %}
<div class="login-page mt-100">
    <div class="container">
        <div class="login-form common-form mx-auto text-center">
            <h2 class="section-heading text-center mb-4">Введите код из письма</h2>
            
            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <fieldset>
                    <input type="text" name="code" placeholder="4 цифры" maxlength="4" style="text-align: center; font-size: 24px; letter-spacing: 5px;" required>
                </fieldset>
                <button type="submit" class="btn-primary d-block mt-3 btn-signin">ПОДТВЕРДИТЬ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
