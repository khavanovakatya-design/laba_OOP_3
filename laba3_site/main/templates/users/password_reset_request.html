{% extends 'base.html' %}

{% block content %}
<div class="login-page mt-100">
    <div class="container">
        <div class="login-form common-form mx-auto">
            <h2 class="section-heading text-center">Сброс пароля</h2>
            {% if messages %}
                {% for message in messages %}
                    <p style="color: red;">{{ message }}</p>
                {% endfor %}
            {% endif %}
            <p>Введите вашу почту, и мы отправим вам код для сброса пароля.</p>
            <form method="post">
                {% csrf_token %}
                <fieldset>
                    <label class="label">Email</label>
                    {{ form.email }}
                </fieldset>
                <button type="submit" class="btn-primary d-block mt-3 btn-signin">ОТПРАВИТЬ КОД</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
